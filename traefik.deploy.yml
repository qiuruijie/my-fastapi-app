# Traefik 生产部署的 TLS 默认证书配置
# 注意：这是 file provider 的【动态配置】文件，由 compose.deploy.yml 中
# --providers.file.filename 加载。Traefik v3 的静态配置（traefik.yml）已移除
# tls.stores 节，若把它当静态配置挂载会报 no valid configuration found in file。
tls:
  stores:
    default:
      # 自有证书（PEM 格式）。文件放在项目根的 certs/ 目录（已在 .gitignore 中忽略，切勿提交）
      # 若云厂商下载的文件名不同（如 xxx_public.crt / xxx.key），请重命名或调整下面路径
      defaultCertificate:
        certFile: /certificates/fullchain.pem
        keyFile: /certificates/privkey.key
